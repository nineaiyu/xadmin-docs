server {
  listen 80;
  server_tokens off;

  # 安全头只在 server 级声明：location 里一旦出现 add_header，会整体丢失这些头。
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  # CSP：VitePress 产物含内联 hydration 脚本与样式，直接强制会白屏；
  # 启用前需按构建产物生成 hash/nonce 并在隔离环境验证（暂不开启）。

  gzip on;
  gzip_min_length 1k;
  gzip_buffers 4 16k;
  gzip_comp_level 8;
  gzip_types text/plain application/javascript application/x-javascript text/css application/xml text/javascript application/x-httpd-php image/jpeg image/gif image/png;
  gzip_vary on;
  gzip_static on;

  location / {
    # exact matches -> reverse clean urls -> folders -> not found
    try_files $uri $uri.html $uri/ =404;
    # non existent pages
    error_page 404 /404.html;
    # a folder without index.html raises 403 in this setup
    error_page 403 /404.html;
    # adjust caching headers
    # files in the assets folder have hashes filenames
    # 只用 expires 下发长缓存，不在此处 add_header：否则 assets 会丢掉 server 级安全头。
    # 带内容哈希的产物一年缓存已足够，immutable 的边际收益低于安全头一致性。
    location ~* ^/assets/ {
        expires 1y;
    }
    # 必须用 root 而不是 alias：try_files 与 alias 组合会把 /index.html 也判成 404，
    # 实测全站不可达（2026-10-26 容器复验）。
    root /usr/share/nginx/html;
  }
}
